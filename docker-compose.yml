# docker compose up -d            (GPU: needs the NVIDIA Container Toolkit)
# docker compose --profile postgres up -d   to use PostgreSQL instead of SQLite
services:
  mabix:
    build: .
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      MABCAT_WARMUP: "stt,tts"
    ports: ["8000:8000"]
    volumes:
      - ./storage:/app/storage
      - models:/models
      - ./youtube_token.json:/app/youtube_token.json:ro
    deploy:
      resources:
        limits: {memory: 24g}
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    depends_on: [ollama]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped
  postgres:
    profiles: [postgres]
    image: postgres:16
    environment: {POSTGRES_DB: mabcat, POSTGRES_USER: mabcat, POSTGRES_PASSWORD: change-me}
    volumes: [pg:/var/lib/postgresql/data]
    restart: unless-stopped
volumes: {models: {}, ollama: {}, pg: {}}
